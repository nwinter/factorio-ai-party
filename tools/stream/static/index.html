<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pog stream overlay</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="/static/factorio-ui.css">
<link rel="stylesheet" href="/static/overlay.css">
</head>
<body class="fx-overlay">
<div id="stage">
  <div class="cam" id="cam-main" data-slot="main"><div class="cam-label"></div></div>
  <div class="cam" id="cam-cam2" data-slot="cam2"><div class="cam-label"></div></div>
  <div class="cam" id="cam-cam3" data-slot="cam3"><div class="cam-label"></div></div>
  <div id="segment" hidden></div>
  <div id="alerts"></div>
  <div id="research-card" hidden></div>

  <aside id="side">
    <header id="head" class="panel">
      <div class="titles">
        <div id="title">Player of Games</div>
        <div id="subtitle"></div>
      </div>
      <div class="clock">
        <div id="clock">0h00m</div>
        <div id="clock-sub">game time</div>
      </div>
    </header>

    <section id="cards"></section>

    <section id="board" class="panel" hidden>
      <div class="board-head">
        <div class="panel-title">Team board</div>
        <div id="board-stats"></div>
      </div>
      <div id="board-log"></div>
      <div id="board-claims"></div>
    </section>

    <section id="prod" class="panel">
      <div id="sci">
        <span class="panel-title">Science</span>
        <span id="spm">–</span><span class="unit">/min</span>
        <svg id="spm-spark" viewBox="0 0 120 26" preserveAspectRatio="none"><path class="a"/><path class="l"/></svg>
        <span id="packs"></span>
        <span id="stage-label"></span>
      </div>
      <div id="sparks"></div>
    </section>

    <section id="space" class="panel" hidden>
      <div class="space-head"><span class="panel-title">Space</span><span id="space-planets"></span><span id="space-sci"></span></div>
      <div id="space-plats"></div>
    </section>

    <section id="chat" class="panel">
      <div class="panel-title">Chat</div>
      <div id="chat-list"></div>
    </section>
  </aside>
</div>
<script src="/static/avatar.js"></script>
<script src="/static/items.js"></script>
<script src="/static/casters.js"></script>
<script src="/static/segview.js"></script>
<script src="/static/chatfeed.js"></script>
<script src="/static/overlay.js"></script>
<script src="/static/audio.js"></script>
</body>
</html>
