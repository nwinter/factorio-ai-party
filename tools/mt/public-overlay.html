<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Factorio · The factory race</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}canvas{position:absolute;inset:0;width:1920px;height:1080px}#summary{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>
<canvas id="race" width="1920" height="1080" aria-label="Factory race standings, team activity, maps and recent events"></canvas><div id="summary" aria-live="polite"></div>
<script src="/mapview.js"></script>
<script>
'use strict';
const canvas=document.getElementById('race'), ctx=canvas.getContext('2d');
const C={bg:'#0b1118',panel:'#141e29',line:'#2a3846',ink:'#f2f4ed',muted:'#a8bac6',dim:'#6e8293',gold:'#f2d47c'};
const colors={green:'#85e0a3',yellow:'#f4d36b',blue:'#7ebaff',red:'#ff8d8d'};
const imgs=new Map(); let state={teams:[],events:[],viewers:[],now:0}, lost=false;
const cap=s=>String(s||'').replace(/-/g,' ').replace(/^./,c=>c.toUpperCase());
const color=t=>colors[t]||C.muted;
function rect(x,y,w,h,c,r=0){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function line(x,y,x2,y2,c=C.line,width=1){ctx.strokeStyle=c;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();}
function label(s,x,y,size=20,c=C.ink,weight=500,width=1000){
 ctx.font=`${weight} ${size}px "Segoe UI",system-ui,sans-serif`;ctx.fillStyle=c;
 let t=String(s??'');if(ctx.measureText(t).width>width){while(t&&ctx.measureText(t+'…').width>width)t=t.slice(0,-1);t+='…';}ctx.fillText(t,x,y);
}
function wrap(s,x,y,width,size=19,c=C.ink,max=2){
 ctx.font=`500 ${size}px "Segoe UI",system-ui,sans-serif`;let words=String(s||'').split(/\s+/),out='',n=0;
 for(let i=0;i<words.length;i++){const next=out?out+' '+words[i]:words[i];if(ctx.measureText(next).width>width&&out){label(out,x,y+n*(size+6),size,c,500,width);n++;out=words[i];if(n===max-1){label([out,...words.slice(i+1)].join(' '),x,y+n*(size+6),size,c,500,width);return;}}else out=next;}
 if(out&&n<max)label(out,x,y+n*(size+6),size,c,500,width);
}
function icon(kind,name,x,y,size=30){
 if(!name)return;const url=`/static/game/${kind}/${name}.webp`;
 if(!imgs.has(url)){const im=new Image();im.onload=()=>draw();im.onerror=()=>{imgs.set(url,null);};imgs.set(url,im);im.src=url;}
 const im=imgs.get(url);if(im?.complete&&im.naturalWidth)ctx.drawImage(im,x,y,size,size);
}
function pill(text,x,y,c=C.gold,w){w=w||text.length*9+20;rect(x,y,w,24,c+'20',4);label(text,x+10,y+17,13,c,750,w-14);}
function time(tick){if(tick==null)return '';const sec=Math.floor(tick/60);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function spark(values,x,y,w,h,c){
 if(values.length<2)return;line(x,y+h,x+w,y+h,C.line);
 const top=Math.max(1,...values);ctx.beginPath();values.forEach((v,i)=>{const px=x+i*w/(values.length-1),py=y+h-v/top*h;i?ctx.lineTo(px,py):ctx.moveTo(px,py);});ctx.strokeStyle=c;ctx.lineWidth=2;ctx.stroke();
 label('0',x,y+h+14,11,C.dim);label(Math.round(top)+' SPM',x+w-63,y-4,11,C.muted,500,70);
}
function research(t,x,y,w){
 const r=t.research||{},p=r.progress;
 if(!r.current&&(!t.startup||t.startup_steps==null))return;
 icon('tech',r.current,x,y-25,32);
 label(r.current?cap(r.label||r.current):'Opening: '+t.startup_steps+' of 5 foundations',x+(r.current?40:0),y,19,C.ink,600,w-72);
 label(r.current&&p!=null?Math.round(p*100)+'%':'',x+w-48,y,19,color(t.team),700,54);
 if(r.current&&p!=null){rect(x,y+10,w,5,'#25303c',2);rect(x,y+10,w*p,5,color(t.team),2);}
 else if(!r.current&&t.startup){rect(x,y+10,w,5,'#25303c',2);rect(x,y+10,w*t.startup_steps/5,5,color(t.team),2);}
}
function scoreboard(t,i,n){
 const w=(1872-(n-1)*12)/n,x=24+i*(w+12),y=70,col=color(t.team),compact=n>=4;
 rect(x,y,w,162,C.panel,8);rect(x,y,5,162,col,2);
 if(t.rank!=null)label(String(t.rank).padStart(2,'0'),x+18,y+45,39,t.leader?col:C.dim,800,66);
 const nameX=x+(t.rank==null?22:86);
 label(cap(t.team),nameX,y+31,25,C.ink,750,w-270);
 if(t.gap&&t.gap!=='Awaiting score')label(t.gap,nameX,y+57,16,t.stale?'#ffb790':col,650,w-270);
 if(t.leader&&!t.stale)pill('LEADER',x+w-94,y+13,col,80);
 const allies=[...new Set((t.pacts||[]).map(p=>cap(p.with)))];
 if(allies.length)label('PACT · '+allies.join(', '),x+w-230,y+57,13,C.gold,650,208);
 const count=t.startup?t.startup_steps:t.research?.done_count;
 if(count!=null){icon('item',t.startup?'burner-mining-drill':'lab',x+20,y+73,28);label(count+(t.startup?'/5 built':' techs'),x+54,y+95,25,C.ink,750,140);}
 const spm=t.science?.spm;if(spm!=null)label(spm.toFixed(1)+' SPM',x+(compact?180:218),y+95,23,C.ink,700,160);
 spark(t.science?.series||[],x+w-(compact?112:184),y+75,compact?88:160,26,col);
 research(t,x+22,y+130,w-44);
 if((t.space?.rockets||0)>0){icon('item','rocket-part',x+w-194,y+10,25);label(t.space.rockets,x+w-162,y+30,20,C.gold,700,60);}
}
function minimap(t,x,y,w,h){
 const m=t.map;if(!m)return;rect(x,y,w,h,'#0a141b',5);
 const scale=Math.min((w-12)/m.w,(h-25)/m.h),ox=x+(w-m.w*scale)/2,oy=y+6+(h-25-m.h*scale)/2;
 const palette=Object.fromEntries(PogMap.BASE.map(v=>[v[0],v[1]]));
 // Same category colours and run grouping as the main stream/site map.
 const runs=PogMap.runs(m);for(const [ch,spans]of Object.entries(runs)){ctx.fillStyle=palette[ch]||C.dim;for(const [cx,cy,len]of spans)ctx.fillRect(ox+cx*scale,oy+cy*scale,Math.max(1,len*scale),Math.max(1,scale));}
 for(const a of t.agents){const p=a.position;if(!p)continue;const px=(p.x-m.x0)/m.cell,py=(p.y-m.y0)/m.cell;if(px>=0&&py>=0&&px<m.w&&py<m.h){ctx.beginPath();ctx.arc(ox+px*scale,oy+py*scale,4,0,Math.PI*2);ctx.fillStyle=color(t.team);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();}}
 const age=m.tick==null||t.tick==null?null:Math.max(0,Math.round((t.tick-m.tick)/3600));
 label('BASE MAP'+(age==null?'':age?' · '+age+'m old':' · <1m'),x+8,y+h-6,11,C.muted,600,w-16);
}
function visibleTeamChat(t){
 const names=new Set(t.agents.map(a=>a.name));
 return (t.chat||[]).filter(m=>m.team===t.team&&names.has(m.name)&&['talk','tell'].includes(m.kind)&&Array.isArray(m.to)&&m.to.every(n=>n==='team'||names.has(n)));
}
function agentText(a,t){
 const active=['thinking','acting','idle','resting','offline','dead'].includes(a.activity);
 const status=t.stale?'DELAYED':t.paused?'PAUSED':active?a.activity.toUpperCase():'';
 return {who:a.display_name+(status?' · '+status:''),detail:active?a.action||'':a.model||''};
}
function teamsNow(s){
 const n=s.teams.length,h=684/Math.max(1,n),x=1328,w=568,compact=n>=4;
 label('TEAM VIEWS',x,270,16,C.muted,750);label('ACTIVITY + TEAM CHAT',x+334,270,13,C.dim,650);
 s.teams.forEach((t,i)=>{const y=284+i*h,on=s.camera?.team===t.team,col=color(t.team),mapw=126;
 rect(x,y,w,h-8,C.panel,6);if(on)rect(x,y,3,h-8,col);
 minimap(t,x+10,y+10,mapw,compact?78:84);const tx=x+(t.map?mapw+26:14),tw=x+w-14-tx;
 label(cap(t.team),tx,y+25,21,col,750,tw-106);if(on)pill('ON CAMERA',x+w-113,y+8,col,103);
 const agents=t.agents.slice(0,3);
 agents.forEach((a,j)=>{const {who,detail}=agentText(a,t);
 if(compact||agents.length>=3){label(who+(detail?' · '+detail:''),tx,y+45+j*19,14,C.ink,550,tw);}
 else if(agents.length===2){const ay=y+50+j*28;label(who,tx,ay,12,C.muted,700,148);label(detail,tx+156,ay,16,C.ink,600,tw-156);}
 else{const ay=y+42+j*34;label(who,tx,ay,13,C.muted,700,tw);label(detail,tx,ay+18,17,C.ink,600,tw);}
 });
 const count=compact?1:2, chat=visibleTeamChat(t).slice(-count), top=compact?100:106, slot=compact?50:58;
 if(chat.length)line(x+14,y+top-11,x+w-14,y+top-11);
 chat.forEach((m,j)=>{const yy=y+top+j*slot;
 const who=cap(m.name)+(m.kind==='tell'?' → '+m.to.map(cap).join(', '):'');
 label(who,x+14,yy+6,12,col,700,w-105);label(time(m.tick),x+w-66,yy+6,12,C.dim,600,56);
 wrap(m.text,x+14,yy+26,w-28,16,C.ink,2);
 });
 });
}
function news(s){
 const events=(s.events||[]).slice(0,2);if(!events.length)return;
 const x=1328,y=990;label('RACE NEWS',x,y,14,C.muted,750);label('GAME TIME',x+482,y,11,C.dim,600,86);
 events.forEach((e,i)=>{const yy=y+12+i*38,col=color(e.team);icon(e.icon_kind||'item',e.icon,x,yy+5,26);
 label(cap(e.team)+(s.camera?.team!==e.team?' · OFF CAMERA':''),x+36,yy+9,11,col,750,440);
 label(e.text,x+36,yy+28,17,C.ink,600,520);label((e.observed?'~':'')+e.time,x+494,yy+9,12,C.muted,600,74);
 });
}
function diplomacyRows(s){
 const teams=new Map(s.teams.map(t=>[t.team,new Set(t.agents.map(a=>a.name))]));
 return (s.diplomacy||[]).filter(m=>teams.has(m.from_team)&&teams.has(m.to_team)&&m.from_team!==m.to_team&&teams.get(m.from_team).has(m.agent));
}
function diplomacyChat(s){
 const msgs=diplomacyRows(s);if(!msgs.length)return;
 const m=msgs.at(-1),x=24,w=632;rect(x,980,w,88,C.panel,6);
 label('DIPLOMACY',x+16,998,14,C.gold,750,120);
 label(cap(m.from_team)+' → '+cap(m.to_team)+' · '+cap(m.agent),x+150,998,13,color(m.from_team),700,360);
 label(m.time,x+w-65,998,12,C.muted,600,55);
 wrap(m.text,x+16,1025,w-32,18,C.ink,2);
}
function viewerChat(s){
 // Separate from team lanes even if a malformed producer puts team rows here.
 const msgs=(s.viewers||[]).filter(m=>['site','youtube'].includes(m.source)&&(!m.kind||m.kind==='viewer')&&(!m.lane||m.lane==='viewer')&&!m.team&&!m.agent&&!m.from&&!m.tell&&!m.operator&&!m.confess&&Date.now()/1000-(m.t||0)<=600).slice(-2);
 if(!msgs.length)return;
 const split=diplomacyRows(s).length>0,x=split?672:24,w=split?632:1280;rect(x,980,w,88,C.panel,6);
 label('VIEWER CHAT',x+16,998,14,C.gold,750);
 const statuses={'live':'LIVE · SITE + YOUTUBE','on':'LIVE · SITE + YOUTUBE','off':'CHAT NOT CONNECTED','waiting':'CONNECTING CHAT','connecting':'CONNECTING CHAT','delayed':'CHAT DELAYED','ended':'CHAT ENDED','display-only':'VIEWER MESSAGES'};
 label(statuses[s.viewer_status]||'VIEWER MESSAGES',x+180,998,12,C.muted,650,w-215);
 if(split){const m=msgs.at(-1);label(cap(m.source)+' · '+(m.name||'Viewer'),x+16,1019,12,C.muted,650,250);wrap(m.text,x+16,1040,w-32,17,C.ink,2);return;}
 msgs.forEach((m,i)=>{const yy=1025+i*31,source=m.source==='youtube'?'YOUTUBE':'SITE';pill(source,x+16,yy-18,m.source==='youtube'?'#ff9f91':C.gold,88);
 let receipt=m.delivery==='held'?'QUEUED':m.delivery==='sent'?'SENT':'';
 if(m.delivery==='sent'&&m.targets?.length)receipt+=' → '+(m.targets.includes('all')?'ALL':m.targets.map(cap).join(', '));
 // mt290 publishes site receipts separately, keyed by the public site sequence.
 const id=typeof m.id==='string'&&/^site:[0-9]+$/.test(m.id)?m.id.slice(5):null;
 const delivery=id?s.viewer_delivery?.[id]:null;
 if(delivery){const known=new Set(s.teams.map(t=>t.team)),sent=Array.isArray(delivery.teams)?[...new Set(delivery.teams.filter(t=>known.has(t)))]:[];
 if(sent.length)receipt=sent.length===known.size?'SENT → ALL':sent.length+'/'+known.size+' SENT';
 else if(delivery.s==='held')receipt='QUEUED';}
 label(receipt,x+115,yy,11,C.muted,650,142);label(m.text,x+265,yy,20,C.ink,500,w-282);
 });
}
function draw(){
 const s=state;ctx.clearRect(0,0,1920,1080);
 rect(0,0,1920,248,C.bg);rect(0,248,24,720,C.bg);rect(1304,248,616,720,C.bg);rect(0,968,1920,112,C.bg);
 label('FACTORIO',24,37,27,C.ink,850);label('THE FACTORY RACE',201,36,16,C.gold,750);
 if(s.ranking&&!s.ranking.startsWith('Awaiting'))label(s.ranking,480,36,16,C.muted,600,900);
 const ticks=s.teams.map(t=>t.tick).filter(t=>t!=null);if(ticks.length)label('GAME '+time(Math.max(...ticks)),1670,36,20,C.ink,700,226);
 const teams=[...s.teams].sort((a,b)=>(a.rank??99)-(b.rank??99));teams.forEach((t,i)=>scoreboard(t,i,teams.length));
 ctx.strokeStyle=C.line;ctx.lineWidth=2;ctx.strokeRect(24,248,1280,720);
 const on=s.teams.find(t=>t.team===s.camera?.team);if(on){const col=color(on.team);rect(44,268,430,60,'#0b1118ee',6);rect(44,268,5,60,col);label('ON CAMERA / '+cap(on.team),62,292,18,col,750,395);label(on.stale?'Feed delayed':on.paused?'WORLD PAUSED':s.camera.reason||'Following the action',62,315,16,C.muted,500,395);}
 label('Graphics copyright Wube Software',1000,958,12,'#c9d0c8',500,295);
 teamsNow(s);news(s);diplomacyChat(s);viewerChat(s);
 if(s.fixture){rect(44,930,670,30,'#0b1118ee',4);label(s.fixture+' · camera still from mtt1',56,951,14,C.gold,700,645);}
 if(lost||Date.now()/1000-s.now>25){rect(480,268,500,46,'#5b301dee',6);label('FEED DELAYED · showing last confirmed state',498,298,19,'#ffdbb5',700,465);}
 document.getElementById('summary').textContent=teams.map(t=>`${t.team}${t.rank!=null?': '+t.gap:''}${t.research?.done_count!=null?', '+t.research.done_count+' technologies':''}. ${t.agents.map(a=>{const v=agentText(a,t);return v.who+(v.detail?': '+v.detail:'');}).join('. ')}`).join(' / ');
}
function render(s){state=s;lost=false;draw();}
async function poll(){try{const r=await fetch('/state.json',{cache:'no-store'});if(!r.ok)throw Error('unavailable');render(await r.json());}catch{lost=true;draw();}}
window.render=render;window.raceState=()=>state;
poll();setInterval(poll,2000);setInterval(draw,1000);
</script></html>
